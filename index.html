<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>تیرانداز اول‌شخص</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#0a0e14; font-family: Tahoma, Arial, sans-serif; }
  #crosshair {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    width:22px; height:22px; pointer-events:none; z-index:10;
  }
  #crosshair::before, #crosshair::after {
    content:''; position:absolute; background:#e8e8e8;
  }
  #crosshair::before { left:50%; top:0; width:2px; height:100%; margin-left:-1px; }
  #crosshair::after { top:50%; left:0; height:2px; width:100%; margin-top:-1px; }
  #hud {
    position:fixed; top:16px; left:16px; color:#e8e8e8; z-index:10;
    font-size:18px; line-height:1.6; text-shadow: 0 1px 3px rgba(0,0,0,.8);
    direction: rtl;
  }
  #hud .big { font-size:28px; font-weight:bold; color:#ffcc4d; }
  #timer { position:fixed; top:16px; right:16px; color:#e8e8e8; z-index:10; font-size:22px; direction: rtl; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
  #hitmarker {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) rotate(45deg);
    width:26px; height:26px; pointer-events:none; z-index:9; opacity:0;
  }
  #hitmarker::before, #hitmarker::after { content:''; position:absolute; background:#ff4d4d; }
  #hitmarker::before { left:50%; top:0; width:3px; height:100%; margin-left:-1.5px; }
  #hitmarker::after { top:50%; left:0; height:3px; width:100%; margin-top:-1.5px; }
  #overlay {
    position:fixed; inset:0; background:rgba(10,14,20,0.92); color:#e8e8e8; z-index:20;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    text-align:center; direction: rtl; padding:20px; box-sizing:border-box;
  }
  #overlay h1 { color:#ffcc4d; font-size:40px; margin-bottom:6px; }
  #overlay p { font-size:18px; max-width:520px; line-height:1.8; color:#c9d1d9; }
  #overlay button {
    margin-top:24px; padding:14px 36px; font-size:20px; background:#ffcc4d; color:#111;
    border:none; border-radius:8px; cursor:pointer; font-weight:bold; font-family:inherit;
  }
  #overlay button:hover { background:#ffd97a; }
  #finalScore { font-size:26px; color:#ffcc4d; margin-top:10px; }
  canvas { display:block; }
</style>
</head>
<body>

<div id="hud">
  امتیاز: <span class="big" id="score">0</span><br>
  هدف‌های حذف‌شده: <span id="kills">0</span>
</div>
<div id="timer">زمان: <span id="time">60</span></div>
<div id="crosshair"></div>
<div id="hitmarker"></div>

<div id="overlay">
  <h1>تیرانداز اول‌شخص</h1>
  <p>
    با موس نگاه کن، با کلیدهای W A S D حرکت کن، با اسپیس بپر و با کلیک چپ روی هدف‌های رنگی شلیک کن.
    هدف‌ها بعد از هر برخورد ناپدید می‌شوند و هدف تازه جای آن‌ها ظاهر می‌شود. تا پایان زمان، بیشترین امتیاز رو بگیر!
  </p>
  <div id="finalScore"></div>
  <button id="startBtn">شروع بازی</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---------- Basic scene setup ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1420);
scene.fog = new THREE.Fog(0x0d1420, 20, 90);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 1.7, 0);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- Lighting ----------
const hemi = new THREE.HemisphereLight(0x8899ff, 0x223344, 0.7);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(20, 30, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -60; sun.shadow.camera.right = 60;
sun.shadow.camera.top = 60; sun.shadow.camera.bottom = -60;
scene.add(sun);

// ---------- Ground & arena ----------
const groundGeo = new THREE.PlaneGeometry(200, 200);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x1b2430, roughness: 0.9 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// grid lines for visual reference
const grid = new THREE.GridHelper(200, 40, 0x334455, 0x223040);
scene.add(grid);

// simple boundary walls
const wallMat = new THREE.MeshStandardMaterial({ color: 0x27323f, roughness: 1 });
function makeWall(w,h,d,x,y,z){
  const wall = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), wallMat);
  wall.position.set(x,y,z);
  wall.castShadow = true; wall.receiveShadow = true;
  scene.add(wall);
  return wall;
}
makeWall(200,10,1,0,5,-100);
makeWall(200,10,1,0,5,100);
makeWall(1,10,200,-100,5,0);
makeWall(1,10,200,100,5,0);

// a few obstacle boxes for cover / scenery
const obstacleMat = new THREE.MeshStandardMaterial({ color: 0x3a4657, roughness: 0.8 });
for (let i=0;i<10;i++){
  const s = 2 + Math.random()*3;
  const box = new THREE.Mesh(new THREE.BoxGeometry(s,s,s), obstacleMat);
  box.position.set((Math.random()-0.5)*80, s/2, (Math.random()-0.5)*80);
  box.castShadow = true; box.receiveShadow = true;
  scene.add(box);
}

// ---------- Targets (enemies) ----------
const targets = [];
const targetColors = [0xff5c5c, 0xffa94d, 0x51cf66, 0x4dabf7, 0xda77f2];

function spawnTarget(){
  const color = targetColors[Math.floor(Math.random()*targetColors.length)];
  const group = new THREE.Group();

  const bodyMat = new THREE.MeshStandardMaterial({ color, roughness:0.5, metalness:0.1 });
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.5, 1.1, 4, 8), bodyMat);
  body.position.y = 1.0;
  body.castShadow = true;
  group.add(body);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 12, 12), bodyMat);
  head.position.y = 1.85;
  head.castShadow = true;
  group.add(head);

  // place randomly within arena, away from player start
  let x, z;
  do {
    x = (Math.random()-0.5)*80;
    z = (Math.random()-0.5)*80;
  } while (Math.hypot(x,z) < 8);
  group.position.set(x, 0, z);

  group.userData.isTarget = true;
  group.userData.alive = true;
  scene.add(group);
  targets.push(group);
}

const MAX_TARGETS = 8;
for (let i=0;i<MAX_TARGETS;i++) spawnTarget();

function respawnTarget(target){
  let x, z;
  do {
    x = (Math.random()-0.5)*80;
    z = (Math.random()-0.5)*80;
  } while (Math.hypot(x,z) < 8);
  target.position.set(x, 0, z);
  target.userData.alive = true;
  target.visible = true;
  target.scale.set(1,1,1);
}

// ---------- Pointer lock controls (manual, no external lib needed) ----------
let yaw = 0, pitch = 0;
const PI_2 = Math.PI/2;

document.body.addEventListener('mousemove', (e) => {
  if (document.pointerLockElement !== document.body) return;
  yaw   -= e.movementX * 0.0022;
  pitch -= e.movementY * 0.0022;
  pitch = Math.max(-PI_2*0.95, Math.min(PI_2*0.95, pitch));
});

function updateCameraRotation(){
  camera.rotation.order = 'YXZ';
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;
}

// ---------- Movement ----------
const keys = {};
window.addEventListener('keydown', (e) => keys[e.code] = true);
window.addEventListener('keyup', (e) => keys[e.code] = false);

let velocityY = 0;
let onGround = true;
const moveSpeed = 8;
const gravity = -22;
const jumpSpeed = 8;

function updateMovement(dt){
  const forward = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw)).multiplyScalar(-1);
  const right = new THREE.Vector3(Math.sin(yaw+PI_2), 0, Math.cos(yaw+PI_2)).multiplyScalar(-1);

  let move = new THREE.Vector3();
  if (keys['KeyW']) move.add(forward);
  if (keys['KeyS']) move.sub(forward);
  if (keys['KeyD']) move.add(right);
  if (keys['KeyA']) move.sub(right);
  if (move.lengthSq() > 0) move.normalize().multiplyScalar(moveSpeed*dt);

  camera.position.x += move.x;
  camera.position.z += move.z;

  // clamp within arena
  camera.position.x = Math.max(-95, Math.min(95, camera.position.x));
  camera.position.z = Math.max(-95, Math.min(95, camera.position.z));

  // jump / gravity
  if (keys['Space'] && onGround){
    velocityY = jumpSpeed;
    onGround = false;
  }
  velocityY += gravity*dt;
  camera.position.y += velocityY*dt;
  if (camera.position.y <= 1.7){
    camera.position.y = 1.7;
    velocityY = 0;
    onGround = true;
  }
}

// ---------- Shooting ----------
const raycaster = new THREE.Raycaster();
let score = 0, kills = 0;
const scoreEl = document.getElementById('score');
const killsEl = document.getElementById('kills');
const hitmarker = document.getElementById('hitmarker');

// simple muzzle flash / particle burst on hit
function burstEffect(position, color){
  const group = new THREE.Group();
  for (let i=0;i<10;i++){
    const p = new THREE.Mesh(
      new THREE.BoxGeometry(0.12,0.12,0.12),
      new THREE.MeshBasicMaterial({ color })
    );
    p.position.copy(position);
    p.userData.vel = new THREE.Vector3((Math.random()-0.5)*6, Math.random()*5+2, (Math.random()-0.5)*6);
    group.add(p);
  }
  scene.add(group);
  let life = 0;
  function animateBurst(){
    life += 0.016;
    group.children.forEach(p => {
      p.userData.vel.y -= 12*0.016;
      p.position.addScaledVector(p.userData.vel, 0.016);
    });
    if (life < 0.6){
      requestAnimationFrame(animateBurst);
    } else {
      scene.remove(group);
    }
  }
  animateBurst();
}

function shoot(){
  if (!gameRunning) return;
  raycaster.setFromCamera({x:0,y:0}, camera);
  const meshes = [];
  targets.forEach(t => { if (t.userData.alive) t.children.forEach(c => meshes.push(c)); });
  const intersects = raycaster.intersectObjects(meshes);

  if (intersects.length > 0){
    const hitMesh = intersects[0].object;
    const parent = hitMesh.parent;
    if (parent && parent.userData.isTarget && parent.userData.alive){
      parent.userData.alive = false;
      const color = hitMesh.material.color.getHex();
      const worldPos = new THREE.Vector3();
      hitMesh.getWorldPosition(worldPos);
      burstEffect(worldPos, color);
      parent.visible = false;

      score += 10;
      kills += 1;
      scoreEl.textContent = score;
      killsEl.textContent = kills;

      hitmarker.style.opacity = 1;
      setTimeout(() => hitmarker.style.opacity = 0, 120);

      setTimeout(() => respawnTarget(parent), 700);
    }
  }
}

document.body.addEventListener('mousedown', (e) => {
  if (e.button === 0 && document.pointerLockElement === document.body) shoot();
});

// ---------- Pointer lock / start flow ----------
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const finalScoreEl = document.getElementById('finalScore');
let gameRunning = false;
let timeLeft = 60;
const timeEl = document.getElementById('time');
let timerInterval = null;

startBtn.addEventListener('click', () => {
  document.body.requestPointerLock();
});

document.addEventListener('pointerlockchange', () => {
  if (document.pointerLockElement === document.body){
    if (!gameRunning) startGame();
    overlay.style.display = 'none';
  } else {
    if (gameRunning) pauseGame();
  }
});

function startGame(){
  gameRunning = true;
  score = 0; kills = 0; timeLeft = 60;
  scoreEl.textContent = score;
  killsEl.textContent = kills;
  timeEl.textContent = timeLeft;
  targets.forEach(respawnTarget);

  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft -= 1;
    timeEl.textContent = timeLeft;
    if (timeLeft <= 0){
      endGame();
    }
  }, 1000);
}

function pauseGame(){
  gameRunning = false;
  overlay.style.display = 'flex';
  finalScoreEl.textContent = '';
  document.querySelector('#overlay h1').textContent = 'بازی متوقف شد';
  document.querySelector('#overlay p').textContent = 'برای ادامه دوباره کلیک کن.';
  startBtn.textContent = 'ادامه بازی';
}

function endGame(){
  gameRunning = false;
  clearInterval(timerInterval);
  document.exitPointerLock();
  overlay.style.display = 'flex';
  document.querySelector('#overlay h1').textContent = 'پایان بازی!';
  document.querySelector('#overlay p').textContent = 'زمان تمام شد. نتیجه‌ات رو ببین:';
  finalScoreEl.textContent = 'امتیاز نهایی: ' + score + '  |  هدف‌های حذف‌شده: ' + kills;
  startBtn.textContent = 'دوباره بازی کن';
}

// ---------- Animate loop ----------
let lastTime = performance.now();
function animate(){
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min((now-lastTime)/1000, 0.05);
  lastTime = now;

  if (gameRunning){
    updateCameraRotation();
    updateMovement(dt);
    // gentle bob for targets
    targets.forEach(t => {
      if (t.userData.alive) t.rotation.y += dt*0.6;
    });
  }

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
