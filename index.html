<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Assistant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            height: 100vh;
            overflow: hidden;
        }

        .app {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */

        .header {
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 18px;
            background: #111827;
            border-bottom: 1px solid #263244;
        }

        .logo {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-left: 10px;
        }

        .title {
            font-size: 17px;
            font-weight: bold;
        }

        .status {
            font-size: 12px;
            color: #22c55e;
            margin-top: 3px;
        }

        /* Chat */

        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 12px 15px;
            border-radius: 16px;
            line-height: 1.6;
            font-size: 15px;
        }

        .ai {
            align-self: flex-start;
            background: #1e293b;
            border-bottom-left-radius: 5px;
        }

        .user {
            align-self: flex-end;
            background: #2563eb;
            border-bottom-right-radius: 5px;
        }

        /* Input */

        .input-area {
            padding: 10px;
            background: #111827;
            border-top: 1px solid #263244;
            display: flex;
            gap: 8px;
        }

        .input-area input {
            flex: 1;
            border: none;
            outline: none;
            background: #1e293b;
            color: white;
            padding: 13px 15px;
            border-radius: 14px;
            font-size: 15px;
        }

        .input-area input::placeholder {
            color: #94a3b8;
        }

        .send {
            width: 48px;
            border: none;
            border-radius: 14px;
            background: #2563eb;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .send:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>

<div class="app">

    <div class="header">

        <div class="logo">
            🤖
        </div>

        <div>
            <div class="title">
                AI Assistant
            </div>

            <div class="status">
                ● آنلاین
            </div>
        </div>

    </div>


    <div class="chat" id="chat">

        <div class="message ai">
            سلام 👋<br>
            من دستیار هوش مصنوعی شما هستم.
        </div>

        <div class="message user">
            سلام!
        </div>

        <div class="message ai">
            سلام! چطور می‌توانم کمکتان کنم؟ 🚀
        </div>

    </div>


    <div class="input-area">

        <input
            id="messageInput"
            type="text"
            placeholder="پیام خود را بنویسید..."
            autocomplete="off"
        >

        <button
            class="send"
            onclick="sendMessage()"
        >
            ➤
        </button>

    </div>

</div>


<script>

function sendMessage() {

    const input = document.getElementById("messageInput");
    const chat = document.getElementById("chat");

    const text = input.value.trim();

    if (text === "") {
        return;
    }

    const userMessage = document.createElement("div");

    userMessage.className = "message user";

    userMessage.textContent = text;

    chat.appendChild(userMessage);

    input.value = "";

    chat.scrollTop = chat.scrollHeight;


    setTimeout(() => {

        const aiMessage = document.createElement("div");

        aiMessage.className = "message ai";

        aiMessage.textContent =
            "پیامت دریافت شد. در مرحله بعد من را به هوش مصنوعی واقعی متصل می‌کنیم.";

        chat.appendChild(aiMessage);

        chat.scrollTop = chat.scrollHeight;

    }, 500);

}


document
    .getElementById("messageInput")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            sendMessage();
        }

    });

</script>

</body>
</html>
