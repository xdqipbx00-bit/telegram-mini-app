<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>آدم رو پیدا کن</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Tahoma', 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 16px;
      overflow-x: hidden;
      transition: background 0.3s;
    }

    body.wrong {
      animation: redFlash 0.4s ease;
    }

    @keyframes redFlash {
      0% { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
      30% { background: #ff2222; }
      100% { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    }

    h1 {
      color: white;
      font-size: 1.8rem;
      margin: 12px 0 8px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
      text-align: center;
    }

    .subtitle {
      color: rgba(255,255,255,0.9);
      font-size: 1rem;
      margin-bottom: 20px;
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
    }

    .cell {
      aspect-ratio: 1;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
      transition: transform 0.15s, box-shadow 0.15s;
      background: #fff;
      border: 3px solid transparent;
    }

    .cell:active {
      transform: scale(0.95);
    }

    .cell img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .cell.correct {
      border-color: #22c55e;
      box-shadow: 0 0 0 4px #22c55e, 0 8px 25px rgba(34,197,94,0.4);
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      flex-direction: column;
      padding: 20px;
    }

    .overlay.show {
      display: flex;
    }

    .message-box {
      background: white;
      border-radius: 24px;
      padding: 32px 28px;
      text-align: center;
      max-width: 340px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .message-box h2 {
      font-size: 2rem;
      color: #16a34a;
      margin-bottom: 12px;
    }

    .message-box p {
      color: #444;
      font-size: 1.1rem;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .btn {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      padding: 14px 32px;
      font-size: 1.15rem;
      border-radius: 50px;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
      box-shadow: 0 6px 20px rgba(102,126,234,0.4);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .btn:active {
      transform: scale(0.96);
    }

    /* Confetti canvas */
    #confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 90;
    }

    .footer {
      margin-top: 24px;
      color: rgba(255,255,255,0.7);
      font-size: 0.85rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>🐑 آدم رو پیدا کن 🐑</h1>
  <p class="subtitle">بین گوسفندها، آدم رو پیدا کن و روش کلیک کن!</p>

  <div class="grid" id="grid"></div>

  <p class="footer">موقعیت آدم هر بار عوض می‌شه 😉</p>

  <div class="overlay" id="overlay">
    <div class="message-box">
      <h2>🎉 آفرین! 🎉</h2>
      <p>درست پیدا کردی!<br>آدم رو پیدا کردی 👏</p>
      <button class="btn" id="restartBtn">شروع دوباره</button>
    </div>
  </div>

  <canvas id="confetti"></canvas>

  <script>
    // Pool of sheep images (local)
    const sheepImages = [
      'sheep/sheep1.jpg',
      'sheep/sheep2.jpg',
      'sheep/sheep3.jpg',
      'sheep/sheep4.jpg',
      'sheep/sheep5.jpg',
      'sheep/sheep6.jpg',
      'sheep/sheep7.jpg',
      'sheep/sheep8.jpg',
      'sheep/sheep9.jpg',
      'sheep/sheep10.jpg',
      'sheep/sheep11.jpg',
      'sheep/sheep12.jpg',
      'sheep/sheep13.jpg',
      'sheep/sheep14.jpg',
      'sheep/sheep15.jpg'
    ];

    const humanImage = 'sheep/human.jpg';

    let humanIndex = -1;
    let isLocked = false;

    const grid = document.getElementById('grid');
    const overlay = document.getElementById('overlay');
    const restartBtn = document.getElementById('restartBtn');
    const confettiCanvas = document.getElementById('confetti');
    const ctx = confettiCanvas.getContext('2d');

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function startGame() {
      isLocked = false;
      overlay.classList.remove('show');
      grid.innerHTML = '';

      // Pick 8 unique sheep
      const selectedSheep = shuffle(sheepImages).slice(0, 8);
      humanIndex = Math.floor(Math.random() * 9);

      const images = [];
      for (let i = 0; i < 9; i++) {
        if (i === humanIndex) {
          images.push({ src: humanImage, isHuman: true });
        } else {
          images.push({ src: selectedSheep.pop(), isHuman: false });
        }
      }

      images.forEach((item, index) => {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.index = index;

        const img = document.createElement('img');
        img.src = item.src;
        img.alt = item.isHuman ? 'آدم' : 'گوسفند';
        img.loading = 'eager';

        cell.appendChild(img);
        cell.addEventListener('click', () => handleClick(index, item.isHuman, cell));
        grid.appendChild(cell);
      });
    }

    function handleClick(index, isHuman, cell) {
      if (isLocked) return;
      isLocked = true;

      if (isHuman) {
        cell.classList.add('correct');
        setTimeout(() => {
          showSuccess();
        }, 400);
      } else {
        // Wrong
        if (navigator.vibrate) {
          navigator.vibrate([80, 40, 80]);
        }
        document.body.classList.add('wrong');
        setTimeout(() => {
          document.body.classList.remove('wrong');
          isLocked = false;
        }, 450);
      }
    }

    function showSuccess() {
      overlay.classList.add('show');
      launchConfetti();
    }

    // Confetti
    let confettiPieces = [];
    let confettiAnim = null;

    function launchConfetti() {
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
      confettiPieces = [];

      const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#54a0ff', '#5f27cd', '#01a3a4', '#f368e0', '#ff9f43', '#10ac84'];

      for (let i = 0; i < 180; i++) {
        confettiPieces.push({
          x: Math.random() * confettiCanvas.width,
          y: Math.random() * confettiCanvas.height - confettiCanvas.height,
          w: Math.random() * 10 + 6,
          h: Math.random() * 6 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          speed: Math.random() * 4 + 2,
          angle: Math.random() * 360,
          spin: (Math.random() - 0.5) * 12,
          opacity: 1
        });
      }

      if (confettiAnim) cancelAnimationFrame(confettiAnim);
      animateConfetti();
    }

    function animateConfetti() {
      ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);

      let stillAlive = false;
      confettiPieces.forEach(p => {
        p.y += p.speed;
        p.x += Math.sin(p.angle * Math.PI / 180) * 1.5;
        p.angle += p.spin;
        p.opacity -= 0.004;

        if (p.opacity > 0 && p.y < confettiCanvas.height + 20) {
          stillAlive = true;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.angle * Math.PI / 180);
          ctx.globalAlpha = Math.max(0, p.opacity);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        }
      });

      if (stillAlive) {
        confettiAnim = requestAnimationFrame(animateConfetti);
      } else {
        ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      }
    }

    restartBtn.addEventListener('click', () => {
      if (confettiAnim) cancelAnimationFrame(confettiAnim);
      ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      startGame();
    });

    // Start
    startGame();

    // Resize canvas
    window.addEventListener('resize', () => {
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
