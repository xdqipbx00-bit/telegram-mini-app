<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAYA - هوش مصنوعی</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* هدر */
        .header {
            background: #111;
            padding: 15px 20px;
            text-align: center;
            border-bottom: 1px solid #333;
            font-size: 1.4rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .header span {
            color: #00ff9d;
        }

        /* ناحیه چت */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        /* پیام معرفی اولیه */
        .welcome {
            margin: auto;
            text-align: center;
            max-width: 500px;
            padding: 30px 20px;
            animation: fadeIn 0.8s ease;
        }

        .welcome h1 {
            font-size: 2.2rem;
            margin-bottom: 12px;
            color: #00ff9d;
        }

        .welcome p {
            color: #aaa;
            line-height: 1.7;
            font-size: 1.05rem;
        }

        /* حباب پیام */
        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }

        .user-message {
            background: #1a1a1a;
            border: 1px solid #333;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            color: #fff;
        }

        .bot-message {
            background: #0d0d0d;
            border: 1px solid #222;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            color: #e0e0e0;
        }

        .bot-message .name {
            font-size: 0.75rem;
            color: #00ff9d;
            margin-bottom: 4px;
            font-weight: 600;
        }

        /* ناحیه ورودی */
        .input-area {
            background: #111;
            padding: 15px 20px;
            border-top: 1px solid #333;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        #user-input {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            padding: 14px 18px;
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        #user-input:focus {
            border-color: #00ff9d;
        }

        #send-btn {
            background: #00ff9d;
            color: #000;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s, background 0.2s;
        }

        #send-btn:hover {
            background: #00e68a;
            transform: scale(1.05);
        }

        #send-btn:active {
            transform: scale(0.95);
        }

        /* انیمیشن */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* اسکرول‌بار زیبا */
        #chat-container::-webkit-scrollbar {
            width: 6px;
        }
        #chat-container::-webkit-scrollbar-track {
            background: #111;
        }
        #chat-container::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <div class="header">
        <span>SAYA</span> • هوش مصنوعی
    </div>

    <div id="chat-container">
        <!-- پیام معرفی اولیه -->
        <div class="welcome" id="welcome-message">
            <h1>سلام، من SAYA هستم</h1>
            <p>
                هوش مصنوعی شخصی شما.<br>
                هر سوالی داری بپرس، آماده‌ام کمکت کنم.
            </p>
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="پیامت رو بنویس..." autocomplete="off">
        <button id="send-btn">➤</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const welcomeMessage = document.getElementById('welcome-message');

        // پاسخ‌های از پیش تعریف‌شده
        const responses = {
            greetings: [
                "سلام! خوش اومدی 😊",
                "سلام، حالت چطوره؟",
                "درود! چطور می‌تونم کمکت کنم؟",
                "سلام عزیز، خوشحالم که اینجایی",
                "هی! من SAYA هستم، بگو ببینم چی می‌خوای"
            ],
            howAreYou: [
                "ممنون، خوبم! تو چطوری؟",
                "عالی‌ام، ممنون که پرسیدی 🌟",
                "خوبم، آماده‌ام کمکت کنم"
            ],
            thanks: [
                "خواهش می‌کنم ❤️",
                "قابلی نداشت!",
                "خوشحالم تونستم کمکت کنم"
            ],
            default: [
                "متوجه نشدم. می‌تونی واضح‌تر بگی؟",
                "فعلاً فقط روی سلام و احوال‌پرسی کار می‌کنم. به زودی هوش مصنوعی واقعی وصل می‌شه!",
                "سوال جالبی بود، ولی هنوز به مدل اصلی وصل نشدم. فعلاً با من گپ بزن 😊"
            ]
        };

        // تابع انتخاب تصادفی
        function getRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        // پیدا کردن پاسخ مناسب
        function getReply(text) {
            const msg = text.trim().toLowerCase();

            if (msg.includes('سلام') || msg.includes('درود') || msg.includes('هی') || msg.includes('hello') || msg.includes('hi')) {
                return getRandom(responses.greetings);
            }
            if (msg.includes('خوبی') || msg.includes('حالت') || msg.includes('چطوری') || msg.includes('خوب هستی')) {
                return getRandom(responses.howAreYou);
            }
            if (msg.includes('ممنون') || msg.includes('مرسی') || msg.includes('تشکر')) {
                return getRandom(responses.thanks);
            }
            return getRandom(responses.default);
        }

        // اضافه کردن پیام به صفحه
        function addMessage(text, isUser = false) {
            // حذف پیام خوش‌آمدگویی بعد از اولین پیام
            if (welcomeMessage) {
                welcomeMessage.remove();
            }

            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message');
            msgDiv.classList.add(isUser ? 'user-message' : 'bot-message');

            if (!isUser) {
                msgDiv.innerHTML = `<div class="name">SAYA</div>${text}`;
            } else {
                msgDiv.textContent = text;
            }

            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // ارسال پیام
        function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // نمایش پیام کاربر
            addMessage(text, true);
            userInput.value = '';

            // شبیه‌سازی تأخیر کوتاه برای طبیعی‌تر شدن
            setTimeout(() => {
                const reply = getReply(text);
                addMessage(reply, false);
            }, 600 + Math.random() * 400);
        }

        // رویدادها
        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // فوکوس روی اینپوت هنگام لود
        userInput.focus();
    </script>
</body>
</html>
