```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Assistant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            background: #07111f;
            color: white;
            overflow: hidden;
        }

        .app {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #07111f;
        }

        /* =========================
           Header
        ========================= */

        .header {
            height: 60px;
            min-height: 60px;

            display: flex;
            align-items: center;

            padding: 0 18px;

            background: #081526;
            border-bottom: 1px solid #14263b;
        }

        .logo {
            width: 38px;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #162a43;

            font-size: 20px;

            margin-left: 10px;
        }

        .title {
            font-size: 17px;
            font-weight: bold;
        }

        .status {
            margin-top: 3px;

            font-size: 12px;

            color: #22c55e;
        }

        /* =========================
           Chat
        ========================= */

        .chat {
            flex: 1;

            overflow-y: auto;

            padding: 25px 18px;

            display: flex;
            flex-direction: column;

            gap: 14px;

            background: #07111f;
        }

        /* پیام معرفی وسط صفحه */

        .welcome-container {
            flex: 1;

            display: flex;

            align-items: center;
            justify-content: center;

            text-align: center;
        }

        .welcome {
            max-width: 430px;

            padding: 25px;

            color: #e5e7eb;

            font-size: 17px;

            line-height: 1.9;
        }

        .welcome-icon {
            font-size: 48px;

            margin-bottom: 12px;
        }

        .welcome-title {
            font-size: 23px;

            font-weight: bold;

            margin-bottom: 10px;
        }

        .welcome-text {
            color: #9ca3af;

            font-size: 15px;
        }

        /* =========================
           Messages
        ========================= */

        .message {
            max-width: 75%;

            padding: 11px 15px;

            border-radius: 16px;

            line-height: 1.7;

            font-size: 15px;

            word-wrap: break-word;
        }

        /* پیام کاربر - سمت راست */

        .user {
            align-self: flex-end;

            background: #ffffff;

            color: #111827;

            border-bottom-right-radius: 5px;
        }

        /* پیام هوش مصنوعی - سمت چپ */

        .ai {
            align-self: flex-start;

            background: #17263a;

            color: #f1f5f9;

            border-bottom-left-radius: 5px;
        }

        /* =========================
           Input
        ========================= */

        .input-area {
            width: 100%;

            padding: 10px;

            display: flex;

            gap: 8px;

            background: #081526;

            border-top: 1px solid #14263b;
        }

        .input-area input {
            flex: 1;

            min-width: 0;

            border: none;
            outline: none;

            background: #122238;

            color: white;

            padding: 13px 15px;

            border-radius: 14px;

            font-size: 15px;
        }

        .input-area input::placeholder {
            color: #7f91a8;
        }

        .send {
            width: 48px;
            min-width: 48px;

            border: none;

            border-radius: 14px;

            background: #2563eb;

            color: white;

            font-size: 20px;

            cursor: pointer;

            transition: 0.15s;
        }

        .send:hover {
            background: #1d4ed8;
        }

        .send:active {
            transform: scale(0.95);
        }

        /* =========================
           Scrollbar
        ========================= */

        .chat::-webkit-scrollbar {
            width: 6px;
        }

        .chat::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat::-webkit-scrollbar-thumb {
            background: #1b3048;

            border-radius: 10px;
        }

        /* =========================
           Mobile
        ========================= */

        @media (max-width: 600px) {

            .header {
                height: 56px;
                min-height: 56px;

                padding: 0 14px;
            }

            .chat {
                padding: 18px 12px;
            }

            .message {
                max-width: 82%;

                font-size: 14px;
            }

            .welcome {
                padding: 20px;
            }

            .welcome-title {
                font-size: 21px;
            }

            .welcome-text {
                font-size: 14px;
            }

            .input-area {
                padding: 8px;
            }

        }

    </style>

</head>


<body>

<div class="app">

    <!-- Header -->

    <div class="header">

        <div class="logo">
            🤖
        </div>

        <div>

            <div class="title">
                AI Assistant
            </div>

            <div class="status">
                ● آنلاین
            </div>

        </div>

    </div>


    <!-- Chat -->

    <div class="chat" id="chat">

        <!-- پیام معرفی اولیه -->

        <div class="welcome-container" id="welcome">

            <div class="welcome">

                <div class="welcome-icon">
                    🤖
                </div>

                <div class="welcome-title">
                    دستیار هوش مصنوعی
                </div>

                <div class="welcome-text">
                    سلام! من دستیار هوش مصنوعی شما هستم.
                    می‌توانم به سؤالات شما پاسخ بدهم،
                    اطلاعات را بررسی کنم و در انجام کارهای مختلف به شما کمک کنم.
                </div>

            </div>

        </div>

    </div>


    <!-- Input -->

    <div class="input-area">

        <input
            id="messageInput"
            type="text"
            placeholder="پیام خود را بنویسید..."
            autocomplete="off"
        >

        <button
            class="send"
            onclick="sendMessage()"
        >
            ➤
        </button>

    </div>

</div>


<script>

function sendMessage() {

    const input =
        document.getElementById("messageInput");

    const chat =
        document.getElementById("chat");

    const welcome =
        document.getElementById("welcome");

    const text =
        input.value.trim();


    if (text === "") {
        return;
    }


    /* حذف پیام معرفی */

    if (welcome) {
        welcome.remove();
    }


    /* پیام کاربر */

    const userMessage =
        document.createElement("div");

    userMessage.className =
        "message user";

    userMessage.textContent =
        text;

    chat.appendChild(
        userMessage
    );


    /* پاک کردن Input */

    input.value = "";


    /* رفتن به پایین چت */

    chat.scrollTop =
        chat.scrollHeight;


    /* پاسخ آزمایشی AI */

    setTimeout(() => {

        const aiMessage =
            document.createElement("div");

        aiMessage.className =
            "message ai";

        aiMessage.textContent =
            "پیام شما دریافت شد. در مرحله بعد، این قسمت را به هوش مصنوعی واقعی متصل می‌کنیم.";

        chat.appendChild(
            aiMessage
        );


        chat.scrollTop =
            chat.scrollHeight;

    }, 500);

}


/* ارسال با Enter */

document
    .getElementById("messageInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                sendMessage();

            }

        }
    );

</script>

</body>

</html>
```
